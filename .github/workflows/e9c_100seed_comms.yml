name: E9C 100-Seed Communication Bytes

on:
  push:
    branches:
      - experiment/e9c-100seed-comms
    paths:
      - experiments/run_e9c_100seed_comms.py
      - tests/test_e9c_100seed_comms.py
      - .github/workflows/e9c_100seed_comms.yml

permissions:
  contents: read

jobs:
  communication-100seed:
    name: E9C 100R 50T 100 seeds zero-loss real sender bytes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dedicated E9C runner tests
        run: python -m unittest discover -s tests -p 'test_e9c_100seed_comms.py' -v
      - name: Verify full unit regression
        run: python -m unittest discover -s tests -v > /tmp/e9c_all_tests.log 2>&1 || { cat /tmp/e9c_all_tests.log; exit 1; }
      - name: Execute real 100-seed protocol sends
        shell: bash
        run: |
          set -eu
          echo "SHA=$GITHUB_SHA"
          python -m experiments.run_e9c_100seed_comms \
            --robots 100 \
            --tasks 50 \
            --seeds 100 \
            --first-seed 0 \
            --cbaa-iterations 1,2,3,4,5,6,8 \
            --max-rounds 300 \
            --latency-mode constant \
            --output-root results/e9c_100seed_ci
      - name: Upload raw and summary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e9c-100seed-real-communication-evidence
          path: results/e9c_100seed_ci/
          if-no-files-found: warn
          retention-days: 30
