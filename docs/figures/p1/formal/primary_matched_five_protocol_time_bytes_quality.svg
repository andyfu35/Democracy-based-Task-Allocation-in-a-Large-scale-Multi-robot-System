<text x="775" y="877" fill="#66768A" font-size="12">ONLY same five-way natively successful paired seeds</text>
<text x="52" y="912" font-size="16" font-weight="bold">Critical endpoint distinction</text>
<text x="52" y="940" font-size="15">Voting pays reliable Score/Commit; CBAA/CBBA/Auction have local/observer stopping without equivalent paid finalization.</text>
<text x="52" y="965" font-size="15">External first feasibility is read-only and MUST NOT terminate an algorithm. Incomplete or unobservable events remain missing, not imputed.</text>
<text x="52" y="990" font-size="15">Rady application delay plus assumed 144 Mbps medium is a model, not measured 802.11 or deployed multi-robot wireless time.</text>
